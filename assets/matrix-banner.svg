    <g class="stream hot mirrored"><text x="286" y="-390">ﾅ8ﾘ4ﾒ0ﾔ6ｸ2ｿ9ﾊ1ｦ7</text><text x="286" y="50">ﾅ8ﾘ4ﾒ0ﾔ6ｸ2ｿ9ﾊ1ｦ7</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" dur="33s" begin="-11s" calcMode="linear" repeatCount="indefinite"/></g>
