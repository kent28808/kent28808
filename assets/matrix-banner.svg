    <g class="stream hot mirrored"><text x="590" y="-390">ﾎ2ﾑ8ﾈ4ﾗ1ｼ7ﾂ0ﾐ6ﾊ3</text><text x="590" y="50">ﾎ2ﾑ8ﾈ4ﾗ1ｼ7ﾂ0ﾐ6ﾊ3</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" dur="32s" begin="-18s" calcMode="linear" repeatCount="indefinite"/></g>
