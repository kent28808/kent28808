    <g class="stream dim"><text x="476" y="-390">ﾚ0ｶ7ﾌ4ﾓ9ﾆ1ｻ6ﾜ2ﾖ8</text><text x="476" y="50">ﾚ0ｶ7ﾌ4ﾓ9ﾆ1ｻ6ﾜ2ﾖ8</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" dur="39s" begin="-20s" calcMode="linear" repeatCount="indefinite"/></g>
