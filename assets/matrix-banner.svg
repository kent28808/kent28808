    <g class="stream dim"><text x="172" y="-390">7ﾒ3ｸ0ﾌ8ﾅ2ｶ9ﾘ5ﾇ1ﾓ</text><text x="172" y="50">7ﾒ3ｸ0ﾌ8ﾅ2ｶ9ﾘ5ﾇ1ﾓ</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" dur="39s" begin="-4s" calcMode="linear" repeatCount="indefinite"/></g>
    <g class="stream mid mirrored"><text x="210" y="-390">ﾂ0ﾐ8ｼ2ﾊ6ﾗ1ｦ9ﾈ4ﾑ7</text><text x="210" y="50">ﾂ0ﾐ8ｼ2ﾊ6ﾗ1ｦ9ﾈ4ﾑ7</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" dur="36s" begin="-17s" calcMode="linear" repeatCount="indefinite"/></g>
