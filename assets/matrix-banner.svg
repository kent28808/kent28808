<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Falling green digital code</title>
  <desc id="desc">Dense columns of mirrored half-width katakana, Latin letters, numerals, and symbols fall continuously over a pure-black background.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#001006"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="rainTrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#002d10" stop-opacity="0.05"/>
      <stop offset="0.24" stop-color="#007c2e" stop-opacity="0.32"/>
      <stop offset="0.64" stop-color="#00e854" stop-opacity="0.82"/>
      <stop offset="0.88" stop-color="#3dff7d"/>
      <stop offset="1" stop-color="#effff3"/>
    </linearGradient>

    <linearGradient id="textureTrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#005820" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#00c947" stop-opacity="0.72"/>
      <stop offset="0.88" stop-color="#42ff7a"/>
      <stop offset="1" stop-color="#effff3"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-20%" width="300%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="faintGlow" x="-80%" y="-10%" width="260%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="textureA"><text class="texture"><tspan x="0" y="0">ﾊ</tspan><tspan x="0" dy="20">7</tspan><tspan x="0" dy="20">ﾐ</tspan><tspan x="0" dy="20">2</tspan><tspan x="0" dy="20">ﾈ</tspan><tspan x="0" dy="20">4</tspan><tspan x="0" dy="20">ｼ</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">ﾂ</tspan><tspan x="0" dy="20">8</tspan><tspan x="0" dy="20">ﾗ</tspan><tspan x="0" dy="20">3</tspan><tspan x="0" dy="20">ｦ</tspan></text></g>
    <g id="textureB"><text class="texture"><tspan x="0" y="0">ﾘ</tspan><tspan x="0" dy="20">6</tspan><tspan x="0" dy="20">ﾔ</tspan><tspan x="0" dy="20">Z</tspan><tspan x="0" dy="20">ｸ</tspan><tspan x="0" dy="20">9</tspan><tspan x="0" dy="20">ｿ</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">ﾊ</tspan><tspan x="0" dy="20">8</tspan><tspan x="0" dy="20">ｦ</tspan><tspan x="0" dy="20">3</tspan><tspan x="0" dy="20">ﾅ</tspan></text></g>
    <g id="textureC"><text class="texture"><tspan x="0" y="0">4</tspan><tspan x="0" dy="20">ｶ</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">ﾚ</tspan><tspan x="0" dy="20">8</tspan><tspan x="0" dy="20">F</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">ﾓ</tspan><tspan x="0" dy="20">6</tspan><tspan x="0" dy="20">ﾆ</tspan><tspan x="0" dy="20">3</tspan><tspan x="0" dy="20">ﾇ</tspan><tspan x="0" dy="20">9</tspan></text></g>

    <clipPath id="bannerClip">
      <rect width="1200" height="320"/>
    </clipPath>

    <style>
      .stream {
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", "Arial Unicode MS", monospace;
        font-size: 17px;
        letter-spacing: 3px;
        writing-mode: vertical-rl;
        text-orientation: upright;
        fill: url(#rainTrail);
        filter: url(#softGlow);
      }
      .dim { opacity: 0.50; }
      .mid { opacity: 0.76; }
      .hot { opacity: 1; }
      .texture {
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", "Arial Unicode MS", monospace;
        font-size: 15px;
        fill: url(#textureTrail);
        filter: url(#faintGlow);
      }
      .mirrored text {
        transform: scaleX(-1);
        transform-box: fill-box;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        animateTransform { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="1200" height="320" fill="url(#background)"/>

    <!-- Dense luminous texture remains visible if motion is disabled. -->
    <g>
      <use href="#textureA" transform="translate(20 -24)" opacity="0.32"/>
      <use href="#textureB" transform="translate(58 36)" opacity="0.48"/>
      <use href="#textureC" transform="translate(96 -70)" opacity="0.26"/>
      <use href="#textureA" transform="translate(134 10)" opacity="0.58"/>
      <use href="#textureB" transform="translate(172 -42)" opacity="0.34"/>
      <use href="#textureC" transform="translate(210 64)" opacity="0.50"/>
      <use href="#textureA" transform="translate(248 -82)" opacity="0.28"/>
      <use href="#textureB" transform="translate(286 22)" opacity="0.62"/>
      <use href="#textureC" transform="translate(324 -34)" opacity="0.38"/>
      <use href="#textureA" transform="translate(362 52)" opacity="0.54"/>
      <use href="#textureB" transform="translate(400 -66)" opacity="0.30"/>
      <use href="#textureC" transform="translate(438 6)" opacity="0.68"/>
      <use href="#textureA" transform="translate(476 -18)" opacity="0.36"/>
      <use href="#textureB" transform="translate(514 74)" opacity="0.52"/>
      <use href="#textureC" transform="translate(552 -88)" opacity="0.30"/>
      <use href="#textureA" transform="translate(590 28)" opacity="0.64"/>
      <use href="#textureB" transform="translate(628 -50)" opacity="0.38"/>
      <use href="#textureC" transform="translate(666 58)" opacity="0.56"/>
      <use href="#textureA" transform="translate(704 -76)" opacity="0.28"/>
      <use href="#textureB" transform="translate(742 14)" opacity="0.66"/>
      <use href="#textureC" transform="translate(780 -28)" opacity="0.40"/>
      <use href="#textureA" transform="translate(818 68)" opacity="0.50"/>
      <use href="#textureB" transform="translate(856 -92)" opacity="0.32"/>
      <use href="#textureC" transform="translate(894 34)" opacity="0.60"/>
      <use href="#textureA" transform="translate(932 -46)" opacity="0.36"/>
      <use href="#textureB" transform="translate(970 48)" opacity="0.58"/>
      <use href="#textureC" transform="translate(1008 -72)" opacity="0.30"/>
      <use href="#textureA" transform="translate(1046 18)" opacity="0.64"/>
      <use href="#textureB" transform="translate(1084 -20)" opacity="0.40"/>
      <use href="#textureC" transform="translate(1122 72)" opacity="0.52"/>
      <use href="#textureA" transform="translate(1160 -84)" opacity="0.28"/>
      <use href="#textureB" transform="translate(1192 26)" opacity="0.62"/>
    </g>

    <!-- Paired trails make every slow stream repeat continuously without a blank pause. -->
    <g class="stream dim"><text x="20" y="-390">ﾊ7ﾐ2ﾈ4ｼ1ﾂ8ﾗ3ｦ0Z</text><text x="20" y="50">ﾊ7ﾐ2ﾈ4ｼ1ﾂ8ﾗ3ｦ0Z</text><animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" dur="38s" begin="-7s" calcMode="linear" repeatCount="indefinite"/></g>
